name: Padel Manim render test (solo render, sin subir)

# Render de prueba de la escena Manim del globo → mp4 + frames como artefacto.
# NO sube a ningún canal. Para validar el look/claridad antes de cablear.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (cairo/pango/ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg build-essential \
            libcairo2-dev libpango1.0-dev pkg-config python3-dev fonts-dejavu-core
      - name: install manim
        run: pip install "manim>=0.18"
      - name: render scene
        run: |
          cd src/videogen/padel
          manim -qm -r 1080,1920 manim_scene.py PadelLob
          echo "--- output ---"; find . -name "PadelLob.mp4"
      - name: extract frames + filmstrip del vuelo
        run: |
          OUT=$(find . -name "PadelLob.mp4" | head -1)
          echo "video: $OUT · duración:"; ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$OUT" || true
          ffmpeg -y -ss 3.3 -i "$OUT" -frames:v 1 frame_arc.jpg || true
          # filmstrip: 7 frames en fila cubriendo el vuelo (t≈3.3-5.2) → veo el recorrido completo
          ffmpeg -y -ss 3.3 -i "$OUT" -t 1.9 -vf "fps=5,scale=260:462,tile=7x1" flight_strip.jpg || true
          ffmpeg -y -sseof -1.3 -i "$OUT" -frames:v 1 frame_end.jpg || true
          ls -la *.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: padel-manim
          path: |
            **/PadelLob.mp4
            frame_*.jpg
            flight_strip.jpg
          if-no-files-found: warn
