name: Padel Manim render test (animación + voz + música, sin subir)

# Render de prueba: escena Manim del globo → + voz Edge (en-US) + música Pixabay
# muxeadas → mp4 con audio. NO sube a ningún canal. Para validar antes de cablear.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (cairo/pango/ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg build-essential \
            libcairo2-dev libpango1.0-dev pkg-config python3-dev fonts-dejavu-core
      - name: install manim + edge-tts
        run: pip install "manim>=0.18" edge-tts requests
      - name: render scene (silenciosa)
        run: |
          # limpia cualquier render/preview viejo para no muxear el equivocado
          rm -f docs/padel_preview/PadelLob.mp4 || true
          rm -rf src/videogen/padel/media || true
          cd src/videogen/padel
          manim -qm --disable_caching manim_scene.py PadelLob
          echo "--- output ---"; find . -name "PadelLob.mp4"
      - name: voz + música + mux
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          # OJO: usar SÍ o SÍ el render fresco de manim (media/videos), no un preview viejo en docs/
          OUT=$(find . -path "*media/videos*" -name "PadelLob.mp4" | head -1)
          echo "video mudo (render fresco): $OUT · dur:"; ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$OUT" || true
          # 1) voz en-US (misma narración que NARRATION en manim_scene.py)
          python - <<'PY'
          import asyncio, edge_tts
          NARR=("Stuck at the back while they control the net? "
                "Forcing your way through just gives them easy volleys. "
                "So don't. Play the lob. "
                "Take the ball early, and lift it high and deep, over their heads to the back glass. "
                "Now they're forced to turn and chase it down. "
                "And as they retreat, you and your partner step up and take the net. "
                "Control the net, and you control the point. "
                "Follow for more padel tactics.")
          async def go():
              # rate un pelín más lento = más claro/didáctico
              await edge_tts.Communicate(NARR, "en-US-GuyNeural", rate="-6%").save("voice.mp3")
          asyncio.run(go())
          print("voz OK")
          PY
          # 2) música de fondo (Pixabay, best-effort)
          python - <<'PY'
          import os, random, requests
          key=os.environ.get("PIXABAY_API_KEY","").strip()
          done=False
          if key:
              try:
                  q=random.choice(["upbeat energetic sport","motivational upbeat","electronic upbeat"])
                  r=requests.get("https://pixabay.com/api/audio/",params={"key":key,"q":q,"per_page":20,"safesearch":"true"},timeout=30).json()
                  for h in r.get("hits",[]):
                      u=h.get("audio") or h.get("url") or ""
                      if u:
                          open("music.mp3","wb").write(requests.get(u,timeout=60).content); done=True; break
              except Exception as e: print("music fail:",e)
          print("music:", done)
          PY
          # 3) mux SIN cortes: el vídeo se extiende (congela la tarjeta de cierre) hasta
          #    cubrir la voz completa + 1.2s de cola → final limpio, nunca se corta a media frase.
          VDUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$OUT")
          ADUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 voice.mp3)
          FINAL=$(python3 -c "print(round(max($VDUR,$ADUR)+1.2,2))")
          PAD=$(python3 -c "print(round(max(0.0,$FINAL-$VDUR),2))")
          echo "vídeo=$VDUR voz=$ADUR -> final=$FINAL (congela ${PAD}s la tarjeta de cierre)"
          if [ -f music.mp3 ]; then
            ffmpeg -y -stream_loop -1 -i music.mp3 -i "$OUT" -i voice.mp3 \
              -filter_complex "[1:v]tpad=stop_mode=clone:stop_duration=${PAD}[v];[2:a]apad[vo];[0:a]volume=0.09[bg];[vo][bg]amix=inputs=2:duration=first:dropout_transition=0[a]" \
              -map "[v]" -map "[a]" -c:v libx264 -pix_fmt yuv420p -preset veryfast -c:a aac -b:a 160k -t "$FINAL" PadelLob_audio.mp4
          else
            ffmpeg -y -i "$OUT" -i voice.mp3 \
              -filter_complex "[0:v]tpad=stop_mode=clone:stop_duration=${PAD}[v];[1:a]apad[a]" \
              -map "[v]" -map "[a]" -c:v libx264 -pix_fmt yuv420p -preset veryfast -c:a aac -b:a 160k -t "$FINAL" PadelLob_audio.mp4
          fi
          echo "--- con audio ---"; ls -la PadelLob_audio.mp4; ffprobe -v quiet -show_entries format=duration -of csv=p=0 PadelLob_audio.mp4 || true
          ffmpeg -y -ss 8 -i PadelLob_audio.mp4 -frames:v 1 frame_arc.jpg || true
          ffmpeg -y -sseof -1.5 -i PadelLob_audio.mp4 -frames:v 1 frame_end.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: padel-manim
          path: |
            **/PadelLob.mp4
            PadelLob_audio.mp4
            frame_*.jpg
          if-no-files-found: warn
