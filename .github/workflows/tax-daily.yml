# 1 short/día 08:00 UTC (10:00 CEST — mañana laboral, público autónomo).
# 100% gratis: mismo pipeline WaitWhy + prompt fiscal + canal YT separado.
#
# ACTIVO desde 11/09/26 — canal TaxHack ES (@TaxHack_es).
# 1 short/día 08:00 UTC (10:00 CEST — mañana laboral, público autónomo).

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tax:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: tax-once
    secrets: inherit
