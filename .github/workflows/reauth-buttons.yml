name: Reauth buttons (manual)

# Manda a Telegram los botones "RENOVAR TODOS" + por canal, aunque los tokens
# sigan válidos. Para añadir un scope nuevo (p.ej. yt-analytics.readonly del
# watch-time de YPP) sin esperar a que caduque nada.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Filtro por nombre (coma-separado). Vacío = todos. Ej: 'MenteEnCalma,AI Tools Weekly,CuriosLaboral'"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  reauth_buttons:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ${{ inputs.only == '' && 'reauth-buttons' || format('reauth-buttons --only "{0}"', inputs.only) }}
    secrets: inherit
