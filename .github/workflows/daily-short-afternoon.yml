name: Daily Short — segunda tanda (13:00 CEST) → publica 21:00

# Palanca C: segundo Short del día. Genera a las 13:00 CEST y programa
# publicación a las 21:00 CEST (prime time noche España).
# El primer daily-short.yml genera a las 08:00 CEST y ahora publica a las 14:00 CEST
# — A/B testing: auditoría 30/07 sugiere que 14 CEST rinde 2x más que 21 CEST.
# Con este split, comparamos ambas franjas con contenido fresco cada día.

on:
  # REACTIVADO 2026-09-24: user pidió doblar volumen WaitWhy para llegar
  # a YPP (500 subs). Con solo WaitWhy publicando en @waitwhy_ (los otros
  # canales van a sus propios canales YT), NO diluye señal — el pico
  # anterior de 11/día era mezcla de 11 canales; ahora WaitWhy = 2/día.
  # Hora: 11 UTC (13:00 CEST) → publica 21:00 CEST prime time.
  schedule:
    - cron: "11 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: videogen-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autogen:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: autogen-once
      publish_hour: "21"   # noche prime time
    secrets: inherit
