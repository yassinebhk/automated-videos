name: Ayudas long-form weekly (AyudaGob)

# 1 long-form/semana DOMINGO 12 UTC (14 CEST).
# DESACTIVADO hasta OAuth canal Ayudas.

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ayudas_long:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ayudas-longform
    secrets: inherit
