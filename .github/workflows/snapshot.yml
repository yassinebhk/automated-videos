name: Snapshot métricas (backup manual)

# El disparo GARANTIZADO del snapshot ahora vive como piggyback en
# catchup-all-channels.yml (job `snapshot_metrics`), que corre 4×/día vía
# cron-job.org (07/11/15/19 UTC + safety 20:37). Ver memoria
# `gh-scheduler-poco-fiable-usar-cronjob-org`.
#
# Este workflow queda como:
#   - backup por cron GH cada 4h (no fiable, pero cuesta 0 tener)
#   - dispatch manual desde Actions UI cuando quieras forzarlo
#
# Fix 29/09: antes se dependía SOLO del cron interno GH y el snapshot se
# saltaba franjas completas (6+ horas sin datos).

on:
  schedule:
    # backup no-fiable: cada 4h en UTC: 00:10, 04:10, 08:10, 12:10, 16:10, 20:10
    - cron: "10 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: snapshot
    secrets: inherit
