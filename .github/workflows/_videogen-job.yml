# Reusable workflow — llamado por los cron y dispatch workflows.
# Encapsula setup Python + ffmpeg + secrets + ejecución del comando + commit stats.
name: videogen job (reusable)

on:
  workflow_call:
    inputs:
      command:
        description: "Subcomando videogen a ejecutar (autogen-once|longgen-once|hourly-catchup|weekly-catchup|daily-summary|dispatch)"
        required: true
        type: string
      dispatch_cmd:
        description: "Si command=dispatch, el /comando del bot"
        required: false
        type: string
        default: ""
      dispatch_args:
        description: "Args del dispatch"
        required: false
        type: string
        default: ""
      publish_hour:
        description: "Hora local (CEST) a la que publicar el Short (14, 21…). Default 21."
        required: false
        type: string
        default: "21"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji

      - name: Install videogen (editable)
        run: pip install -e .

      - name: Reconstruir secrets/.env desde GitHub Secrets
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CHANNEL_ID_ES: ${{ secrets.YOUTUBE_CHANNEL_ID_ES }}
          YOUTUBE_CHANNEL_ID_EN: ${{ secrets.YOUTUBE_CHANNEL_ID_EN }}
          # Token YT: solo persistimos refresh_token + client_id/secret.
          # El access_token se regenera en cada run (google-auth lo hace solo
          # cuando toca refresh). Simplifica MUCHO la persistencia.
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:      ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:      ${{ secrets.REDDIT_PASSWORD }}
          BLUESKY_HANDLE:       ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE:     ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          # X (Twitter) — OAuth 1.0a, 4 keys (setup 10 min en developer.twitter.com)
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          # Instagram Reels — Meta Graph API (IG Business Login, endpoint graph.instagram.com)
          IG_TOKEN:                ${{ secrets.IG_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          IG_APP_SCOPED_ID:        ${{ secrets.IG_APP_SCOPED_ID }}
          # Threads (Meta) — API separada de IG pero mismo app FB
          THREADS_TOKEN:        ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          # TikTok Content Posting API (Ruta A: draft; Ruta B: direct tras review)
          TIKTOK_ACCESS_TOKEN:  ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_OPEN_ID:       ${{ secrets.TIKTOK_OPEN_ID }}
          TIKTOK_MODE:          ${{ vars.TIKTOK_MODE || 'auto' }}
          # yt-dlp cookies: si YT_COOKIES está seteado, el step "run" abajo
          # lo escribe a /tmp/yt_cookies.txt y backfill._ensure_vertical_local
          # lo pasa a yt-dlp con --cookies (bypass bot-check en runners cloud).
          YT_COOKIES:           ${{ secrets.YT_COOKIES }}
          VOICE_ENGINE:          ${{ vars.VOICE_ENGINE || 'edge' }}
          KOKORO_VOICE_ES:       ${{ vars.KOKORO_VOICE_ES }}
          WEBHOOK_URL:           ${{ vars.WEBHOOK_URL }}
          AUTOGEN_PUBLISH_HOUR:  ${{ inputs.publish_hour || '21' }}
        run: |
          mkdir -p secrets
          # Dump YT_COOKIES a /tmp/yt_cookies.txt para backfill/yt-dlp
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > /tmp/yt_cookies.txt
            echo "YT_COOKIES escrito en /tmp/yt_cookies.txt ($(wc -c < /tmp/yt_cookies.txt) bytes)"
          fi
          # Genera un token JSON mínimo que google-auth OAuth2 acepta.
          # Al primer uso hace refresh automático y rellena access_token.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("secrets/youtube_token.json").write_text(json.dumps({
              "refresh_token": os.environ["YT_REFRESH_TOKEN"],
              "client_id":     os.environ["YT_CLIENT_ID"],
              "client_secret": os.environ["YT_CLIENT_SECRET"],
              "token_uri":     "https://oauth2.googleapis.com/token",
              "scopes":        ["https://www.googleapis.com/auth/youtube.upload",
                                "https://www.googleapis.com/auth/youtube.readonly"],
          }))
          PY
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n'    "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n'      "$TELEGRAM_CHAT_ID"
            printf 'GEMINI_API_KEY=%s\n'        "$GEMINI_API_KEY"
            printf 'PEXELS_API_KEY=%s\n'        "$PEXELS_API_KEY"
            printf 'YOUTUBE_CHANNEL_ID_ES=%s\n' "$YOUTUBE_CHANNEL_ID_ES"
            printf 'YOUTUBE_CHANNEL_ID_EN=%s\n' "$YOUTUBE_CHANNEL_ID_EN"
            [ -n "$REDDIT_CLIENT_ID"     ] && printf 'REDDIT_CLIENT_ID=%s\n' "$REDDIT_CLIENT_ID"
            [ -n "$REDDIT_CLIENT_SECRET" ] && printf 'REDDIT_CLIENT_SECRET=%s\n' "$REDDIT_CLIENT_SECRET"
            [ -n "$REDDIT_USERNAME"      ] && printf 'REDDIT_USERNAME=%s\n' "$REDDIT_USERNAME"
            [ -n "$REDDIT_PASSWORD"      ] && printf 'REDDIT_PASSWORD=%s\n' "$REDDIT_PASSWORD"
            [ -n "$BLUESKY_HANDLE"       ] && printf 'BLUESKY_HANDLE=%s\n' "$BLUESKY_HANDLE"
            [ -n "$BLUESKY_APP_PASSWORD" ] && printf 'BLUESKY_APP_PASSWORD=%s\n' "$BLUESKY_APP_PASSWORD"
            [ -n "$MASTODON_INSTANCE"     ] && printf 'MASTODON_INSTANCE=%s\n' "$MASTODON_INSTANCE"
            [ -n "$MASTODON_ACCESS_TOKEN" ] && printf 'MASTODON_ACCESS_TOKEN=%s\n' "$MASTODON_ACCESS_TOKEN"
            [ -n "$X_API_KEY"           ] && printf 'X_API_KEY=%s\n' "$X_API_KEY"
            [ -n "$X_API_SECRET"        ] && printf 'X_API_SECRET=%s\n' "$X_API_SECRET"
            [ -n "$X_ACCESS_TOKEN"      ] && printf 'X_ACCESS_TOKEN=%s\n' "$X_ACCESS_TOKEN"
            [ -n "$X_ACCESS_SECRET"     ] && printf 'X_ACCESS_SECRET=%s\n' "$X_ACCESS_SECRET"
            [ -n "$IG_TOKEN"            ] && printf 'IG_TOKEN=%s\n' "$IG_TOKEN"
            [ -n "$IG_USER_ID"          ] && printf 'IG_USER_ID=%s\n' "$IG_USER_ID"
            [ -n "$IG_APP_SCOPED_ID"    ] && printf 'IG_APP_SCOPED_ID=%s\n' "$IG_APP_SCOPED_ID"
            [ -n "$THREADS_TOKEN"       ] && printf 'THREADS_TOKEN=%s\n' "$THREADS_TOKEN"
            [ -n "$THREADS_USER_ID"     ] && printf 'THREADS_USER_ID=%s\n' "$THREADS_USER_ID"
            [ -n "$TIKTOK_ACCESS_TOKEN" ] && printf 'TIKTOK_ACCESS_TOKEN=%s\n' "$TIKTOK_ACCESS_TOKEN"
            [ -n "$TIKTOK_REFRESH_TOKEN"] && printf 'TIKTOK_REFRESH_TOKEN=%s\n' "$TIKTOK_REFRESH_TOKEN"
            [ -n "$TIKTOK_CLIENT_KEY"   ] && printf 'TIKTOK_CLIENT_KEY=%s\n' "$TIKTOK_CLIENT_KEY"
            [ -n "$TIKTOK_CLIENT_SECRET"] && printf 'TIKTOK_CLIENT_SECRET=%s\n' "$TIKTOK_CLIENT_SECRET"
            [ -n "$TIKTOK_OPEN_ID"      ] && printf 'TIKTOK_OPEN_ID=%s\n' "$TIKTOK_OPEN_ID"
            printf 'TIKTOK_MODE=%s\n' "${TIKTOK_MODE:-auto}"
            printf 'VOICE_ENGINE=%s\n' "${VOICE_ENGINE:-edge}"
            [ -n "$KOKORO_VOICE_ES" ] && printf 'KOKORO_VOICE_ES=%s\n' "$KOKORO_VOICE_ES"
            printf 'AUTOGEN_PUBLISH_HOUR=%s\n' "${AUTOGEN_PUBLISH_HOUR:-21}"
            # WEBHOOK_URL: crítico para el botón inline de reauth YT en Telegram.
            # Sin esto, _send_yt_token_alert solo manda texto sin botón → user
            # no puede hacer reauth desde el móvil sin abrir el Mac.
            [ -n "$WEBHOOK_URL" ] && printf 'WEBHOOK_URL=%s\n' "$WEBHOOK_URL"
          } > .env

      - name: Ejecutar comando videogen
        env:
          # Sin buffering → los prints aparecen en el log en tiempo real
          # (no como bloque al final del step, que oculta dónde abortó el pipeline).
          PYTHONUNBUFFERED: "1"
          AUTOGEN_PUBLISH_HOUR: ${{ inputs.publish_hour || '21' }}
        run: |
          set -x  # traza cada línea shell para ver dónde muere si aborta
          case "${{ inputs.command }}" in
            dispatch)
              videogen dispatch --cmd "${{ inputs.dispatch_cmd }}" --args "${{ inputs.dispatch_args }}"
              ;;
            *)
              videogen ${{ inputs.command }}
              ;;
          esac

      - name: Commit + push stats_history si cambió
        if: always()
        run: |
          # Solo commiteamos el snapshot analytics (append-only).
          # NO commiteamos secrets/ (siempre gitignored) ni output/uploaded/*
          # (videos pesados que no queremos en el repo).
          # Commiteamos: analytics snapshots + docs/ (podcast feed/MP3 + IG reels MP4).
          # docs/podcasts/*.mp3 = audios para Spotify. docs/reels/*.mp4 = videos para IG.
          # Ambos servidos vía GitHub Pages.
          if [ -n "$(git status --porcelain output/stats_history.jsonl output/reddit_history.json output/pinned_summary_id.txt output/case_ledger.json docs/ 2>/dev/null)" ]; then
            git config user.name "videogen-bot"
            git config user.email "bot@videogen.local"
            for f in output/stats_history.jsonl output/reddit_history.json output/pinned_summary_id.txt output/case_ledger.json; do
              [ -f "$f" ] && git add "$f" || true
            done
            # docs/ completo (podcast + reels + cualquier futuro asset servido)
            [ -d docs ] && git add docs/ || true
            git commit -m "stats+docs: snapshot $(date -u +%FT%H:%MZ) [skip ci]" || true
            # Rebase para tolerar race con otro workflow que también commiteó.
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push retry $i falló, reintentando en 3s..."
              sleep 3
            done
          fi
