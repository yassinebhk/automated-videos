name: MenteEnCalma Shorts (2×/día cebo para long-form)

# Shorts 40s ambient — sirven de cebo (algoritmo YT Shorts los muestra a
# usuarios que no conocen el canal). Objetivo: gente ve short → entra al
# perfil → ve videos largos → suscribe.
#
# Horarios: 08:33 UTC (10:33 CEST — mañana) + 17:47 UTC (19:47 CEST — tarde).
# Distanciados de los long-form (07:12 / 14:17 / 21:23) para no saturar canal
# con uploads simultáneos.

on:
  schedule:
    - cron: "33 8 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ambient_short:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ambient-short
    secrets: inherit
