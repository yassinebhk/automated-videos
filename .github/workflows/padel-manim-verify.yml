name: Padel Manim VERIFY (frames de las 8 tacticas, sin subir)

# Renderiza las 8 escenas Manim en calidad baja (rapido) y extrae frames de cada
# una para revisar la calidad visual antes de activar el canal. NO sube nada.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system deps (cairo/pango/ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg build-essential \
            libcairo2-dev libpango1.0-dev pkg-config python3-dev fonts-dejavu-core
      - name: install manim
        run: pip install "manim>=0.18"
      - name: render las 8 escenas + extrae frames
        run: |
          cd src/videogen/padel
          rm -rf media || true
          mkdir -p /tmp/frames
          for S in PadelLob PadelBackWall PadelBandeja PadelSmash PadelDrop PadelServe PadelPositioning PadelDefense PadelFact PadelCompare PadelChecklist; do
            echo "=== render $S ==="
            manim -ql --disable_caching manim_scene.py "$S" || { echo "FALLO $S"; continue; }
            MP4=$(find media -name "$S.mp4" | head -1)
            echo "mp4: $MP4"
            DUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$MP4")
            echo "$S dur=$DUR"
            for PCT in 25 55 88; do
              T=$(awk "BEGIN{printf \"%.2f\", $DUR*$PCT/100}")
              ffmpeg -y -ss "$T" -i "$MP4" -frames:v 1 "/tmp/frames/${S}_${PCT}pct.jpg" || true
            done
          done
          echo "=== frames generados ==="; ls -la /tmp/frames/
      - uses: actions/upload-artifact@v4
        with:
          name: padel-verify-frames
          path: /tmp/frames/*.jpg
          if-no-files-found: warn
