name: Ayudas y subvenciones daily (AyudaGob)

# Canal ayudas/subvenciones ES — CPM €8-12 + volumen brutal SEO.
# 1 short/día 11:00 UTC (13:00 CEST — comida).
# DESACTIVADO hasta setup del user (canal YT + 3 secrets YT_AYUDAS_*).

on:
  # schedule:
  #   - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ayudas:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ayudas-once
    secrets: inherit
