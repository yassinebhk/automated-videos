name: Purge Videos (manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script en deploy/ a ejecutar (sin .py)"
        default: "purga_saturacion_25_26_ago"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: pip install -e .
      - name: Escribir token YT
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          mkdir -p secrets
          python3 - <<PY
          import json, os
          from pathlib import Path
          Path("secrets/youtube_token.json").write_text(json.dumps({
              "refresh_token": os.environ["YT_REFRESH_TOKEN"],
              "client_id":     os.environ["YT_CLIENT_ID"],
              "client_secret": os.environ["YT_CLIENT_SECRET"],
              "token_uri":     "https://oauth2.googleapis.com/token",
              "scopes":        ["https://www.googleapis.com/auth/youtube.force-ssl"],
          }))
          PY
      - name: Ejecutar purga
        run: python deploy/${{ inputs.script }}.py --go
