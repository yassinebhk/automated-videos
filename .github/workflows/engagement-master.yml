name: Engagement master (5 palancas en 1 run)

# CONSOLIDACIÓN 28/09: los 5 workflows individuales (engagement, ig-engagement,
# threads-engagement, bsky-reply-boost, playlists-catchup) se unieron aquí
# porque el cron interno GH no los disparaba fiablemente (memoria
# gh-scheduler-poco-fiable-usar-cronjob-org.md). Este único workflow ejecuta
# los 5 comandos en secuencia — el user solo necesita 1 entrada en cron-job.org
# (o clonar la del autogen cambiando el workflow name).
#
# Cadencia: cada 3h. Cada comando lleva sus propios rate-limits internos
# (max/día, ledger dedup) → no importa disparar más veces de las necesarias,
# se saltan solos si ya cumplieron cap.
#
# workflow_dispatch para prueba manual.

on:
  schedule:
    - cron: "13 */3 * * *"   # cada 3h a los 13min (evita colisión con snapshots)
  workflow_dispatch: {}

concurrency:
  group: videogen-engagement-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engagement:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: engagement
    secrets: inherit

  ig_engagement:
    needs: engagement
    if: ${{ always() }}   # aunque uno falle, seguimos con los demás
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ig-engagement
    secrets: inherit

  threads_engagement:
    needs: ig_engagement
    if: ${{ always() }}
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: threads-engagement
    secrets: inherit

  bsky_reply_boost:
    needs: threads_engagement
    if: ${{ always() }}
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: bsky-reply-boost --live
    secrets: inherit

  playlists_catchup:
    needs: bsky_reply_boost
    if: ${{ always() }}
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: playlists-catchup
    secrets: inherit
