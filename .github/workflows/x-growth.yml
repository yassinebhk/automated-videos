name: X growth loop (follows + likes ES)

# Runs diario 10:15 UTC = 12:15 CEST. Follow rotativo + likes moderados
# a un pool curado de cuentas ES (true crime, política, periodismo,
# historia, corrupción). Objetivo: hacerse visible en el timeline
# hispanohablante sin caer en spam-detection.
#
# Free tier X: ~50 escrituras/día (follows + likes cuentan). Diseño
# conservador: 10 follows + 15 likes/día máximo.

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: videogen-x-growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  growth:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: x-growth
    secrets: inherit
