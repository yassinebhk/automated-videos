name: Bluesky growth loop

# Cada día a 09:30 UTC (=11:30 CEST) ejecuta el growth loop:
# - follow-back a nuevos seguidores
# - follow a cuentas nuevas encontradas por keyword del nicho
# - likes moderados (20/día) + reposts (3/día) a posts on-topic
# Rate limits Bluesky (5000 likes/día) están MUY por encima de estos valores.

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: bluesky-growth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  growth:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: bluesky-growth
    secrets: inherit
