name: Bluesky growth loop

# 3× al día (09:30, 14:30, 19:30 UTC = 11:30, 16:30, 21:30 CEST) para
# tocar picos de actividad ES distintos: mañana, tarde-café, prime time.
# Follow-back + follows nicho + likes/reposts on-topic.
# Rate limits Bluesky (5000 likes/día) están muy por encima de 3× esta cadencia.

on:
  schedule:
    - cron: "30 9,14,19 * * *"
  workflow_dispatch: {}

concurrency:
  group: bluesky-growth
  cancel-in-progress: false

permissions:
  contents: write  # reusable job commite stats_history

jobs:
  growth:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: bluesky-growth
    secrets: inherit
