name: Dashboard refresh (panel de control)

on:
  schedule:
    # 2 refrescos extra además del que hace daily-summary (07:00 UTC):
    # 13:10 y 19:10 UTC → el panel de docs/dashboard/ nunca se queda desfasado.
    - cron: "10 13 * * *"
    - cron: "10 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dashboard:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: dashboard
    secrets: inherit
