name: Bi-Weekly Long-form (true crime)

# Aumentado de 1/semana → 2/semana (auditoría 08-07): CPM long-form 10-100×
# mayor que Shorts. Aunque Shorts atraen suscriptores, long-form monetiza.
# Miércoles + Domingo 08:00 UTC (10:00 CEST). Cada uno genera long-form +
# 5 clips atomizados como Shorts derivados.
on:
  schedule:
    - cron: "0 8 * * 0"  # Domingo
    - cron: "0 8 * * 3"  # Miércoles
  workflow_dispatch: {}

concurrency:
  group: videogen-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  longgen:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: longgen-once
    secrets: inherit
