name: MenteEnCalma — daily ambient (3×/día)

# Canal ambient/relax MenteEnCalma. 3 videos/día para compensar cap de
# 14 min por vídeo (canal sin verify SMS, límite YT hard 15min).
# Total 3×14 = 42min de contenido/día con topics distintos rotando.
# Cuando el user verifique SMS, subir env AMBIENT_MAX_MIN=180 y bajar
# cadencia a 1×/día (o mantener 3 para volumen).
#
# Horarios: 07:12 / 14:17 / 21:23 UTC (evita :00 y colisiones otros crons).

on:
  schedule:
    - cron: "12 7 * * *"
    - cron: "17 14 * * *"
    - cron: "23 21 * * *"
  workflow_dispatch: {}

concurrency:
  group: videogen-ambient
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ambient:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ambient-once
    secrets: inherit
