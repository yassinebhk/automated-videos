name: MenteEnCalma — daily long-form ambient

# Canal ambient/relax MenteEnCalma. 1 video/día 07:00 UTC (09:00 CEST).
# 30-60 min de audio (binaural / clásica / naturaleza / lofi) + imagen loop.
# DESACTIVADO hasta setup del user:
# - Canal YT MenteEnCalma
# - 3 secrets YT_AMBIENT_*
# - PIXABAY_API_KEY (para música clásica/naturaleza/lofi CC0)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: videogen-ambient
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ambient:
    uses: ./.github/workflows/_videogen-job.yml
    with:
      command: ambient-once
    secrets: inherit
