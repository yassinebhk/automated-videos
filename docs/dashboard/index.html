<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Mando</title>
<meta name="description" content="Panel de control en tiempo real de todos los canales de YouTube y redes sociales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── LIGHT (por defecto) ── */
:root{
  --ground:#eef1f6; --surface:#ffffff; --raised:#f1f4f9; --border:#e0e5ee;
  --ink:#161c2b; --muted:#5a6478; --faint:#909aae;
  --accent:#4f46e5; --accent-2:#0d9488; --accent-soft:rgba(79,70,229,.10);
  --good:#15a55b; --warn:#d1830f; --bad:#dc4747;
  --good-soft:rgba(21,165,91,.12); --warn-soft:rgba(209,131,15,.13); --bad-soft:rgba(220,71,71,.12);
  --shadow:0 1px 2px rgba(20,28,50,.05),0 2px 8px rgba(20,28,50,.05);
  --shadow-lg:0 20px 50px rgba(20,28,50,.18);
  --radius:16px; --radius-sm:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* ── DARK (navy, no negro) — solo si el visor lo elige ── */
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --ground:#0f1626; --surface:#182034; --raised:#212b44; --border:#2c374f;
  --ink:#e9edf6; --muted:#a3adc4; --faint:#6f7a93;
  --accent:#7d84ff; --accent-2:#2dd4bf; --accent-soft:rgba(125,132,255,.16);
  --good:#3ecf8e; --warn:#f0ad4e; --bad:#f0716f;
  --good-soft:rgba(62,207,142,.15); --warn-soft:rgba(240,173,78,.15); --bad-soft:rgba(240,113,111,.15);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --ground:#0f1626; --surface:#182034; --raised:#212b44; --border:#2c374f;
  --ink:#e9edf6; --muted:#a3adc4; --faint:#6f7a93;
  --accent:#7d84ff; --accent-2:#2dd4bf; --accent-soft:rgba(125,132,255,.16);
  --good:#3ecf8e; --warn:#f0ad4e; --bad:#f0716f;
  --good-soft:rgba(62,207,142,.15); --warn-soft:rgba(240,173,78,.15); --bad-soft:rgba(240,113,111,.15);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ── */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.brand b{font-size:15.5px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:0;
  background:transparent;color:var(--muted);border-radius:11px;font-size:14px;font-weight:600;transition:.13s}
.nav button svg{width:19px;height:19px;flex:none;opacity:.8}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button.on svg{opacity:1}
.rail .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--border)}
.rail .foot .eyebrow{margin-bottom:5px}
.rail .foot .t{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rail .foot a{display:block;margin-top:8px;font-size:11px;color:var(--faint);text-decoration:none;word-break:break-all}
.rail .foot a:hover{color:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:15px 32px}
.topbar h1{font-size:20px}
.topbar .sub{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;align-items:center;gap:7px;margin-top:3px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;transition:.13s}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}
.iconbtn svg{width:19px;height:19px}
.wrap{width:100%;max-width:1780px;margin:0 auto;padding:26px 32px 80px}
section.view{display:none}
section.view.on{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── generic ── */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.sechead{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px}
.sechead h2{font-size:17px}
.sechead .eyebrow{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase}
.pill.active{background:var(--good-soft);color:var(--good)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:8px;background:var(--raised);color:var(--muted)}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.down{background:var(--bad-soft);color:var(--bad)}
.hb{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.hb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.hb.al_dia{background:var(--good-soft);color:var(--good)}
.hb.atrasado{background:var(--warn-soft);color:var(--warn)}
.hb.inactivo,.hb.sin_subidas{background:var(--bad-soft);color:var(--bad)}
.hb.pausado{background:var(--warn-soft);color:var(--warn)}
.hb.sin_datos{background:var(--accent-soft);color:var(--accent)}
.fmt{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:7px}
.fmt.on{background:var(--accent-soft);color:var(--accent)}
.fmt.off{background:var(--raised);color:var(--faint)}
.heat{display:flex;gap:8px;align-items:flex-end;height:140px;padding-top:10px}
.heat .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end;height:100%}
.heat .bar{width:100%;max-width:40px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));border-radius:6px 6px 0 0;min-height:4px;position:relative}
.heat .bar b{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.heat .lb{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600}
.tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--border);color:var(--faint)}
.linkout{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:none}
.linkout:hover{text-decoration:underline}
.linkout svg{width:12px;height:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}

/* KPI */
.kpis{grid-template-columns:repeat(6,1fr)}
.kpi{padding:18px;position:relative;transition:.14s}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi .lab{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.kpi .val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;margin:12px 0 8px;line-height:1}
.kpi .val small{font-size:15px;color:var(--faint)}
.kpi .ic{position:absolute;top:16px;right:16px;color:var(--accent);opacity:.9}
.kpi .ic svg{width:18px;height:18px}

/* hero chart */
.hero{padding:22px 22px 14px}
.hero .top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hero .legend{display:flex;gap:16px;margin-left:auto}
.hero .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.hero .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:0 12px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--raised)}
.tbl .nm{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.cdot{width:10px;height:10px;border-radius:3px;flex:none}
.tbl .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rank{font-family:var(--mono);color:var(--faint);width:22px;text-align:right}

/* donut + legend */
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donutwrap .ring{position:relative;width:190px;height:190px;flex:none}
.donutwrap .ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donutwrap .ring .mid b{font-family:var(--mono);font-size:24px;font-weight:600;display:block;line-height:1}
.donutwrap .ring .mid span{font-size:10px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.dleg{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.dleg .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.dleg .row i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dleg .row .v{font-family:var(--mono);color:var(--muted)}
.dleg .row .p{font-family:var(--mono);color:var(--faint);width:44px;text-align:right}

/* channel cards */
.chgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.chcard{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:.15s;border-top:3px solid var(--_c,var(--accent))}
.chcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.chcard .hd{padding:16px 17px 12px;display:flex;align-items:flex-start;gap:10px}
.chcard .hd h3{font-size:16px;display:flex;align-items:center;gap:6px}
.chcard .hd .st{margin-left:auto}
.chcard .met{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.chcard .met>div{background:var(--surface);padding:12px 15px}
.chcard .met .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.chcard .met .v{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.chcard .spark{height:46px;padding:8px 12px 4px}
.chcard .ft{display:flex;align-items:center;gap:10px;padding:12px 17px 16px;flex-wrap:wrap}
.chcard .ft .deltas{display:flex;gap:6px}
.chcard .ft .det{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px}
.chcard .ft .det:hover{color:var(--accent);border-color:var(--accent)}
.hint{font-size:12px;color:var(--faint);font-style:italic}

/* rank lists */
.ranklist{display:flex;flex-direction:column}
.ranklist .row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.ranklist .row:last-child{border-bottom:0}
.ranklist .row:hover{background:var(--raised)}
.ranklist .rk{font-family:var(--mono);font-size:13px;color:var(--faint);width:26px;text-align:right;flex:none}
.ranklist .bar{width:3px;align-self:stretch;border-radius:3px;flex:none;background:var(--_c,var(--accent));min-height:26px}
.ranklist .ti{min-width:0;flex:1}
.ranklist .ti .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranklist .ti .m{font-size:11px;color:var(--faint);display:flex;gap:8px;margin-top:2px;font-family:var(--mono)}
.ranklist .vv{text-align:right;flex:none}
.ranklist .vv b{font-family:var(--mono);font-size:15px;font-weight:600}
.ranklist .vv span{display:block;font-size:10px;color:var(--faint);font-family:var(--mono)}

.two{grid-template-columns:1fr 1fr}
.g32{grid-template-columns:1.35fr 1fr}

/* insights */
.insights{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ins{padding:16px 18px 16px 20px;border-left:4px solid var(--muted)}
.ins.good{border-color:var(--good)} .ins.warn{border-color:var(--warn)}
.ins.bad{border-color:var(--bad)} .ins.info{border-color:var(--accent)}
.ins h4{font-size:14px;margin-bottom:6px}
.ins p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}

/* social */
.socgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.soc{padding:16px 17px;border-top:3px solid var(--_c,var(--accent))}
.soc .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.soc .big{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;margin:10px 0 1px}
.soc .sub{font-size:11px;color:var(--faint);font-family:var(--mono);display:flex;align-items:center;gap:6px}
.soc .spark{height:40px;margin-top:10px}
.gauge{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.gauge .ring{position:relative;width:150px;height:150px;flex:none}
.gauge .ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .ring .mid b{font-family:var(--mono);font-size:32px;font-weight:600;display:block;line-height:1}
.gauge .ring .mid span{font-size:10px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em}
.iglog{display:flex;flex-direction:column;max-height:380px;overflow:auto}
.iglog .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-size:12.5px}
.iglog .row:last-child{border-bottom:0}
.iglog .s{width:8px;height:8px;border-radius:50%;flex:none}
.iglog .s.ok{background:var(--good)}.iglog .s.fail{background:var(--bad)}
.iglog .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iglog .dt{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.bars>div{margin-bottom:13px}
.bars .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;font-weight:600}
.bars .tr{height:8px;background:var(--raised);border-radius:5px;overflow:hidden}
.bars .tr>div{height:100%;border-radius:5px}

/* agenda */
.subtabs{display:inline-flex;background:var(--raised);border-radius:11px;padding:3px;gap:2px}
.subtabs button{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600}
.subtabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.fchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:20px;
  font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.fchip .sw{width:9px;height:9px;border-radius:3px}
.fchip.on{color:var(--ink);border-color:var(--faint);background:var(--raised)}
.fchip.off{opacity:.5}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.calday{padding:0;overflow:hidden}
.calday .dh{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:7px;background:var(--raised)}
.calday .dh .dn{font-weight:800;font-size:14px;text-transform:capitalize}
.calday .dh .dd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.calday.today .dh{background:var(--accent-soft)} .calday.today .dh .dn{color:var(--accent)}
.calday .evs{padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.ev{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 7px;border-radius:8px;background:var(--raised)}
.ev .tm{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.ev .nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .cc{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:16px}
.ev.paused{opacity:.5;text-decoration:line-through}
.recgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.rec{display:flex;align-items:center;gap:12px;padding:14px 15px}
.rec .cc{width:4px;align-self:stretch;min-height:36px;border-radius:3px;flex:none}
.rec .nm{font-weight:700;font-size:13.5px}
.rec .mt{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.rec .tm{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:15px;text-align:right}
.histday{margin-bottom:10px}
.histday .hd{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  padding:12px 4px 8px;position:sticky;top:0;background:var(--ground)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.5);backdrop-filter:blur(3px);z-index:60;opacity:0;
  pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,94vw);background:var(--ground);
  border-left:1px solid var(--border);z-index:70;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:flex-start;gap:13px;padding:24px 26px 18px;border-bottom:1px solid var(--border)}
.drawer .dh h2{font-size:21px}
.drawer .db{padding:22px 26px 44px;overflow:auto}

.loading{display:grid;place-items:center;min-height:70vh;color:var(--faint);font-family:var(--mono);gap:16px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

const fmt=n=>(n==null?'—':NF.format(n));
const short=n=>n==null?'—':(Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':NF.format(n));

  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>',
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  moon:'<path d="M20 13.5A8 8 0 1 1 10.5 4a6.3 6.3 0 0 0 9.5 9.5z"/>',

  film2:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v14"/>',
  cost:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2 0 0 1 5 0c0 2-3 1.5-3 3M12 15.5v.5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',

};
const HEALTH={al_dia:'Al día',atrasado:'Atrasado',inactivo:'Inactivo',sin_subidas:'Sin subidas',pausado:'En pausa',sin_datos:'Analítica pendiente'};
const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function healthBadge(h){return `<span class="hb ${h}">${HEALTH[h]||h}</span>`}
function fmtBadge(on,label){return `<span class="fmt ${on?'on':'off'}">${on?'✓':'—'} ${label}</span>`}
function agoTxt(days){return days==null?'sin datos':days===0?'hoy':days===1?'ayer':`hace ${days} d`}
const svg=(k,cls='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICON[k]||''}</svg>`;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// sparkline como SVG fijo (no Chart.js) → no rompe el layout de las filas
function sparkSVG(pts,color,w=96,h=30){
  if(!pts||pts.length<2)return `<span style="width:${w}px;flex:none"></span>`;
  const mn=Math.min(...pts),mx=Math.max(...pts),rng=(mx-mn)||1,step=w/(pts.length-1);
  const P=pts.map((v,i)=>`${(i*step).toFixed(1)},${(h-2-((v-mn)/rng)*(h-5)).toFixed(1)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="flex:none;display:block">`
    +`<path d="M0,${h} L${P.join(' L')} L${w},${h} Z" fill="${color}22"/>`
    +`<path d="M${P.join(' L')}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

let DATA=null,CHARTS=[],STATE={sec:'resumen',agView:'cal',filters:{content:1,longform:1,social:1,ops:0},pausedOn:0};
const clearCharts=()=>{CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});CHARTS=[]};
function deltaChip(d,sfx=''){if(d==null)return '<span class="chip">—</span>';if(d===0)return `<span class="chip">±0${sfx}</span>`;const u=d>0;return `<span class="chip ${u?'up':'down'}">${u?'▲':'▼'} ${short(Math.abs(d))}${sfx}</span>`}
function statusPill(s){return `<span class="pill ${s==='active'?'active':'paused'} dot">${s==='active'?'Activo':'Pausa'}</span>`}

/* ── charts ── */
function baseOpts(){
  Chart.defaults.font.family=css('--mono')||'monospace';
  Chart.defaults.color=css('--faint');
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:css('--surface'),titleColor:css('--ink'),
      bodyColor:css('--muted'),borderColor:css('--border'),borderWidth:1,padding:11,cornerRadius:9,
      titleFont:{family:css('--sans'),weight:'700'},bodyFont:{family:css('--mono')}}},
    interaction:{mode:'index',intersect:false}};
}
function heroChart(el,labels,views,subs){
  const o=baseOpts();o.interaction={mode:'index',intersect:false};
  o.scales={
    x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{size:10}}},
    y:{position:'left',grid:{color:css('--border'),drawBorder:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true},
    y1:{position:'right',grid:{display:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true}};
  const ac=css('--accent'),tc=css('--accent-2');
  const g=el.getContext('2d').createLinearGradient(0,0,0,300);
  g.addColorStop(0,ac+'40');g.addColorStop(1,ac+'02');
  const c=new Chart(el,{type:'line',data:{labels,datasets:[
    {label:'Visualizaciones',data:views,yAxisID:'y',borderColor:ac,backgroundColor:g,borderWidth:2.4,tension:.35,pointRadius:0,pointHoverRadius:4,fill:true},
    {label:'Suscriptores',data:subs,yAxisID:'y1',borderColor:tc,backgroundColor:'transparent',borderWidth:2.4,tension:.35,pointRadius:0,pointHoverRadius:4,borderDash:[5,3],fill:false}]},options:o});
  CHARTS.push(c);return c;
}
function spark(el,pts,color){
  const c=new Chart(el,{type:'line',data:{labels:pts.map((_,i)=>i),datasets:[{data:pts,borderColor:color,
    backgroundColor:color+'22',borderWidth:1.8,tension:.35,pointRadius:0,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}}}});
  CHARTS.push(c);return c;
}
function hbar(el,items){
  const o=baseOpts();o.indexAxis='y';o.interaction={mode:'nearest',intersect:true};
  o.scales={x:{grid:{color:css('--border'),drawBorder:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true},
            y:{grid:{display:false},ticks:{font:{size:11.5,family:css('--sans'),weight:'600'},color:css('--ink')}}};
  const c=new Chart(el,{type:'bar',data:{labels:items.map(i=>i.label),datasets:[{data:items.map(i=>i.v),
    backgroundColor:items.map(i=>i.c||css('--accent')),borderRadius:6,maxBarThickness:24}]},options:o});
  CHARTS.push(c);return c;
}
function donut(el,items){
  const c=new Chart(el,{type:'doughnut',data:{labels:items.map(i=>i.label),datasets:[{data:items.map(i=>i.v),
    backgroundColor:items.map(i=>i.c),borderColor:css('--surface'),borderWidth:3,cutout:'66%'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:ctx=>` ${ctx.label}: ${fmt(ctx.raw)}`}}}}});
  CHARTS.push(c);return c;
}
function iggauge(el,ok,fail){
  const c=new Chart(el,{type:'doughnut',data:{datasets:[{data:[ok,fail],
    backgroundColor:[css('--good'),css('--border')],borderColor:css('--surface'),borderWidth:2,cutout:'75%'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}}}});
  CHARTS.push(c);return c;
}
function areaOne(el,labels,data,color,label){
  const o=baseOpts();
  o.scales={x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:7,font:{size:10}}},
            y:{grid:{color:css('--border'),drawBorder:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true}};
  const g=el.getContext('2d').createLinearGradient(0,0,0,220);g.addColorStop(0,color+'40');g.addColorStop(1,color+'02');
  const c=new Chart(el,{type:'line',data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:g,borderWidth:2.4,tension:.35,pointRadius:0,pointHoverRadius:4,fill:true}]},options:o});
  CHARTS.push(c);return c;
}

/* ── nav ── */
function go(sec){STATE.sec=sec;clearCharts();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.sec===sec));
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+sec));
  const TL={vision:'Visión',resumen:'Resumen',canales:'Canales',produccion:'Producción',contenido:'Contenido',redes:'Redes sociales',monetizacion:'Monetización',agenda:'Agenda',informe:'Informe'};
  const tt=document.getElementById('tb-title');if(tt)tt.textContent=TL[sec]||sec;
  try{history.replaceState(null,'','#'+sec)}catch(e){}
  R[sec]();window.scrollTo({top:0,behavior:'instant'});}
function rerender(){clearCharts();R[STATE.sec]();}

/* ── VISIÓN (showcase ejecutivo) ── */
function renderVision(){
  const d=DATA, el=document.getElementById('v-vision');
  const s=d.showcase||{}, v=d.velocity||{}, cats=d.by_category||[], caps=d.capabilities||[];
  const tile=(ic,val,lab,sub)=>`<div class="card kpi"><div class="ic">${svg(ic)}</div>
    <div class="lab">${lab}</div><div class="val">${val}</div>
    <div class="faint" style="font-size:11px">${sub||''}</div></div>`;
  const tiles=[
    tile('film2', fmt(s.content_total), 'Contenido producido', `${fmt(s.videos_yt)} vídeos + ${fmt(s.posts_social)} posts`),
    tile('eye', short(s.views_yt), 'Visualizaciones YT', `en ${s.days} días`),
    tile('users', fmt(s.audience), 'Audiencia total', 'subs + seguidores'),
    tile('play', s.channels, 'Canales de YouTube', `${s.channels_active} activos`),
    tile('globe', s.networks, 'Plataformas', 'YouTube + 5 redes'),
    tile('activity', s.per_day, 'Vídeos al día', 'automáticos, sin tocar nada'),
    tile('share', s.langs, 'Idiomas', 'español + inglés'),
    tile('cost', '€0', 'Coste de operación', '100% herramientas gratis'),
  ].join('');
  const proj = v.span ? `
    <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px;font-family:var(--mono)">
      <div><div class="num" style="font-size:22px;color:var(--good)">+${v.subs_day}/día</div><div class="faint" style="font-size:11px">suscriptores</div></div>
      <div><div class="num" style="font-size:22px;color:var(--good)">+${short(v.views_day)}/día</div><div class="faint" style="font-size:11px">visualizaciones</div></div>
    </div>
    <p style="margin:0 0 4px;font-size:13px">Si el ritmo actual se mantiene:
      <b>${fmt(v.subs_30)} subs</b> y <b>${short(v.views_30)} views</b> en 30 días ·
      <b>${fmt(v.subs_90)} subs</b> y <b>${short(v.views_90)} views</b> en 90.</p>
    <p class="hint" style="margin:0">Proyección lineal orientativa sobre los últimos ${v.span} días — no es una promesa.</p>`
    : '<p class="hint">Aún sin histórico suficiente para proyectar.</p>';
  el.innerHTML=`
    <div class="sechead" style="margin-top:0"><h2>Una fábrica de contenido que se opera sola</h2>
      <span class="eyebrow">a coste cero · ${s.days} días en marcha</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${tiles}</div>

    ${(()=>{const f=d.funnel||{};if(!f.impresiones)return '';const step=(v,l,sub)=>`<div style="text-align:center;flex:1;min-width:130px"><div class="num" style="font-size:26px">${short(v)}</div><div class="faint mono" style="font-size:11px">${l}</div>${sub?`<div class="faint" style="font-size:10px">${sub}</div>`:''}</div>`;const arrow=r=>`<div style="align-self:center;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:0 4px">→<br><span style="font-size:10px">${r}</span></div>`;return `<div class="sechead"><h2>Embudo de alcance</h2><span class="eyebrow">de vista a seguidor</span></div>
      <div class="card pad" style="display:flex;flex-wrap:wrap;gap:6px;align-items:stretch">
        ${step(f.impresiones,'Visualizaciones','impresiones YouTube')}${arrow((f.r_interaccion!=null?f.r_interaccion+'%':''))}
        ${step(f.interacciones,'Interacciones','me gusta + comentarios')}${arrow('')}
        ${step(f.seguidores,'Seguidores',(f.r_seguidor!=null?f.r_seguidor+'% de las vistas':''))}
      </div>`;})()}

    <div class="grid g32" style="margin-top:22px">
      <div class="card pad"><div class="sechead" style="margin:0 0 12px"><h2 style="font-size:15px">Crecimiento y proyección</h2></div>
        ${proj}<div class="chartbox sm" style="margin-top:12px"><canvas id="vgrowth"></canvas></div></div>
      <div class="card pad"><div class="sechead" style="margin:0 0 12px"><h2 style="font-size:15px">Rendimiento por nicho</h2><span class="eyebrow">views/vídeo</span></div>
        <div class="chartbox sm"><canvas id="vcat"></canvas></div>
        ${(d.content.by_language||[]).length>=2?`<div style="display:flex;gap:18px;margin-top:12px;font-family:var(--mono);font-size:12px;flex-wrap:wrap">${d.content.by_language.map(l=>`<span><b style="font-size:16px">${l.vpv}</b> <span class="faint">${l.lang} · ${l.channels} canal${l.channels>1?'es':''}</span></span>`).join('<span class="faint">·</span>')}<span class="faint">views/vídeo por idioma</span></div>`:''}</div>
    </div>

    <div class="sechead"><h2>Qué hace la máquina sola</h2><span class="eyebrow">pipeline de punta a punta</span></div>
    <div class="card pad"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px 22px">
      ${caps.map((c,i)=>`<div style="display:flex;gap:12px;align-items:flex-start">

  heroChart(document.getElementById('vgrowth'),d.net_series.map(p=>p.date),d.net_series.map(p=>p.views),d.net_series.map(p=>p.subs));

const CH_COLORS_JS=['#e63357','#0d9fd8','#1fa463','#c78300','#7c5cff','#e07a3a','#0aa0a0','#c23aad'];

/* ── RESUMEN ── */
function renderResumen(){
  const d=DATA,el=document.getElementById('v-resumen');
  const kpi=d.kpis.map(k=>`<div class="card kpi"><div class="ic">${svg(k.icon)}</div>
    <div class="lab">${k.label}</div>
    <div class="val">${k.value==null?'—':fmt(k.value)}${k.unit?`<small>${k.unit}</small>`:''}</div>
    ${k.delta!=null?`<div>${deltaChip(k.delta)} <span class="faint" style="font-size:11px">7 días</span></div>`:'<div class="faint" style="font-size:11px">acumulado</div>'}</div>`).join('');

  const shareCh=d.channels.filter(c=>c.views>0).sort((a,b)=>b.views-a.views);
  const totV=shareCh.reduce((s,c)=>s+c.views,0);
  const reach=[{label:'YouTube',v:d.totals.yt_subs,c:css('--accent')},
    ...d.socials.map(s=>({label:s.name,v:s.followers,c:s.color}))].sort((a,b)=>b.v-a.v);

  const lead=[...d.channels].sort((a,b)=>b.views-a.views).map((c,i)=>`<tr data-ch="${c.key}" style="cursor:pointer">
    <td class="rank">${i+1}</td>
    <td><div class="nm"><span class="cdot" style="background:${c.color}"></span>${c.name} ${c.flagship?'★':''} <span class="tag">${c.lang}</span>${c.misconfigured?` <span class="tag" title="${c.warn||''}" style="background:#fee2e2;color:#b91c1c;border-color:#fca5a5">⚠ token</span>`:''}</div>
      <div class="faint mono" style="font-size:10.5px">${c.misconfigured?'⚠ '+(c.warn||''):c.cat}</div></td>
    <td>${healthBadge(c.health)}</td>
    <td class="r">${c.misconfigured?'—':fmt(c.subs)}</td><td class="r">${c.misconfigured?'—':fmt(c.views)}</td><td class="r">${c.misconfigured?'—':fmt(c.videos)}</td>
    <td class="r">${c.misconfigured||c.vpv==null?'—':fmt(c.vpv)}</td>
    <td class="r">${c.misconfigured?'—':fmt(c.likes_total)}</td>
    <td class="r">${c.misconfigured||c.eng_rate==null?'—':c.eng_rate+'%'}</td>
    <td class="r">${deltaChip(c.delta7_views)}</td>
    <td class="r faint" style="font-size:11px">${agoTxt(c.days_since)}</td>
    <td style="width:90px"><canvas data-sp="${c.key}" height="26"></canvas></td>
    <td class="r">${c.url?`<a class="linkout" target="_blank" rel="noopener" href="${c.url}">${svg('ext')}</a>`:''}</td></tr>`).join('');

  const al=d.alerts||[];
  const alertsBlock=al.length?`<div class="sechead" style="margin-top:0"><h2>⚠️ Alertas</h2><span class="eyebrow">qué necesita atención ahora</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-bottom:8px">
      ${al.map(a=>`<div class="card ins ${a.tone}" style="padding:13px 15px"><h4 style="font-size:13px">${a.title}</h4><p style="font-size:12px">${a.body}</p></div>`).join('')}</div>`:'';
  el.innerHTML=`${alertsBlock}
    <div class="grid kpis">${kpi}</div>
    <div class="sechead"><h2>Crecimiento de la red</h2><span class="eyebrow">acumulado · toda la red · ${d.range.first} → ${d.range.last}</span></div>
    <div class="card hero"><div class="top"><div class="legend">
        <span><i style="background:${css('--accent')}"></i>Visualizaciones</span>
        <span><i style="background:${css('--accent-2')}"></i>Suscriptores</span></div></div>

function multiline(el,labels,ds){
  const o=baseOpts();o.interaction={mode:'index',intersect:false};
  o.plugins.legend={display:true,labels:{usePointStyle:true,pointStyle:'circle',boxWidth:7,font:{family:css('--sans'),weight:'600'},color:css('--muted')}};
  o.scales={x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:7,font:{size:10}}},
            y:{grid:{color:css('--border'),drawBorder:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true}};
  const c=new Chart(el,{type:'line',data:{labels,datasets:ds.map(d=>({label:d.label,data:d.data,borderColor:d.color,
    backgroundColor:'transparent',borderWidth:2,tension:.3,pointRadius:0,pointHoverRadius:4}))},options:o});
  CHARTS.push(c);return c;
}
function vbar(el,items,color){
  const o=baseOpts();o.interaction={mode:'index',intersect:false};
  o.scales={x:{grid:{display:false},ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:13}},
            y:{grid:{color:css('--border'),drawBorder:false},ticks:{callback:v=>short(v),font:{size:10}},beginAtZero:true}};
  const c=new Chart(el,{type:'bar',data:{labels:items.map(i=>i.label),datasets:[{data:items.map(i=>i.v),
    backgroundColor:color,borderRadius:5,maxBarThickness:30}]},options:o});
  CHARTS.push(c);return c;
}

/* ── AGENDA ── */
const CATLAB={content:'Contenido',longform:'Long-form',social:'Redes',ops:'Operaciones'};
const CATCOL={content:'var(--accent)',longform:'var(--accent-2)',social:'#6364ff',ops:'var(--faint)'};
const DOWES=['dom','lun','mar','mié','jue','vie','sáb'];
function passFilter(e){return STATE.filters[e.category]&&(STATE.pausedOn||!e.paused)}
function renderAgenda(){
  const d=DATA,el=document.getElementById('v-agenda');
  const rec=d.schedule.recurring.filter(r=>!r.paused);
  const shortsDay=rec.filter(r=>r.category==='content'&&r.days==='Cada día').length;
  const longWk=rec.filter(r=>r.category==='longform').length;
  const socialWk=rec.filter(r=>r.category==='social').length;
  const wkTotal=shortsDay*7+longWk;
  const st=(v,lab)=>`<div class="card pad" style="padding:14px 16px"><div class="eyebrow">${lab}</div><div class="num" style="font-size:24px;margin-top:6px">${v}</div></div>`;
  const summary=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:2px 0 4px">
    ${st(shortsDay+'/día','Shorts programados')}${st(longWk+'/sem','Long-form semanales')}${st(socialWk+'/sem','Acciones sociales')}
    ${st('~'+wkTotal+'/sem','Vídeos a la semana')}${st(rec.length,'Tareas automáticas')}</div>`;
  const filters=`<div class="filters">${Object.keys(CATLAB).map(k=>`<button class="fchip ${STATE.filters[k]?'on':'off'}" data-f="${k}"><span class="sw" style="background:${CATCOL[k]}"></span>${CATLAB[k]}</button>`).join('')}
    <button class="fchip ${STATE.pausedOn?'on':'off'}" data-p><span class="sw" style="background:var(--warn)"></span>Incluir pausados</button></div>`;
  const tabs=`<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="subtabs">${[['cal','Calendario'],['list','Lista'],['hist','Histórico']].map(([k,l])=>`<button data-av="${k}" class="${STATE.agView===k?'on':''}">${l}</button>`).join('')}</div><span class="eyebrow">horario Europa/Madrid</span></div>`;
  const body=STATE.agView==='cal'?calView(d):STATE.agView==='list'?listView(d):histView(d);
  el.innerHTML=`<div class="sechead" style="margin-top:0"><h2>Agenda de publicación</h2><span class="eyebrow">todo automático</span></div>${summary}${tabs}${STATE.agView!=='hist'?filters:''}<div id="agbody">${body}</div>`;
  el.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{STATE.agView=b.dataset.av;rerender()});
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{STATE.filters[b.dataset.f]^=1;rerender()});
  const pb=el.querySelector('[data-p]');if(pb)pb.onclick=()=>{STATE.pausedOn^=1;rerender()};
}
function calView(d){
  const days={},today=new Date().toISOString().slice(0,10);
  d.schedule.upcoming.filter(passFilter).forEach(e=>{(days[e.date]=days[e.date]||[]).push(e)});
  const keys=Object.keys(days).sort();
  if(!keys.length)return '<div class="card pad hint">No hay eventos con los filtros actuales.</div>';
  return `<div class="cal">${keys.map(dt=>{const dd=new Date(dt+'T12:00:00'),isT=dt===today;
    return `<div class="card calday ${isT?'today':''}"><div class="dh"><span class="dn">${DOWES[dd.getDay()]}</span><span class="dd">${dt.slice(8)} ${isT?'· hoy':''}</span></div>
      <div class="evs">${days[dt].map(e=>`<div class="ev ${e.paused?'paused':''}"><div class="cc" style="background:${e.color}"></div><span class="tm">${e.time}</span><span class="nn">${e.name}</span></div>`).join('')}</div></div>`}).join('')}</div>`;
}
function listView(d){
  const rec=d.schedule.recurring.filter(passFilter),up=d.schedule.upcoming.filter(passFilter).slice(0,50);
  return `<div class="sechead"><h2 style="font-size:15px">Recurrentes</h2><span class="eyebrow">${rec.length} tareas programadas</span></div>
    <div class="grid recgrid">${rec.map(r=>`<div class="card rec" style="${r.paused?'opacity:.55':''}"><div class="cc" style="background:${r.color}"></div>
      <div style="flex:1;min-width:0"><div class="nm">${r.name}${r.paused?' <span class="tag">pausa</span>':''}</div><div class="mt">${r.days} · ${r.channel}</div></div>
      <div class="tm">${r.time}</div></div>`).join('')||'<div class="hint">—</div>'}</div>
    <div class="sechead"><h2 style="font-size:15px">Próximas ejecuciones</h2><span class="eyebrow">siguientes ${up.length}</span></div>
    <div class="card pad ranklist">${up.map(e=>`<div class="row" style="--_c:${e.color}"><div class="bar"></div>
      <div class="ti"><div class="t">${e.name}</div><div class="m"><span>${e.channel}</span><span class="chip">${CATLAB[e.category]}</span></div></div>
      <div class="vv"><b style="font-size:13px">${e.time}</b><span>${e.date.slice(5)}</span></div></div>`).join('')}</div>`;
}
function histView(d){
  const by={};d.schedule.history.forEach(h=>{if(h.date)(by[h.date]=by[h.date]||[]).push(h)});
  const keys=Object.keys(by).sort().reverse();
  return `<p class="hint" style="margin:8px 0 16px">Vídeos detectados por primera vez en analítica (aprox. fecha de publicación). ${d.schedule.history.length} registros.</p>
    ${keys.map(dt=>`<div class="histday"><div class="hd">${dt} · ${by[dt].length} vídeos</div>
      <div class="card pad ranklist">${by[dt].map(h=>`<a class="row" style="--_c:var(--border)" ${h.url?`href="${h.url}" target="_blank" rel="noopener"`:''}><div class="bar"></div>
        <div class="ti"><div class="t">${h.title||'(sin título)'}</div><div class="m"><span>${h.channel}</span></div></div>
        ${h.url?`<span class="linkout">${svg('ext')}</span>`:''}</a>`).join('')}</div></div>`).join('')}`;
}

const R={vision:renderVision,resumen:renderResumen,canales:renderCanales,produccion:renderProduccion,contenido:renderContenido,redes:renderRedes,monetizacion:renderMonetiz,agenda:renderAgenda,informe:renderInforme};

/* ── theme ── */
function applyTheme(t){
  if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  const dark=t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches);
  const tb=document.getElementById('themebtn');if(tb)tb.innerHTML=svg(dark?'sun':'moon');
  try{localStorage.setItem('dash-theme',t||'')}catch(e){}
  if(DATA)rerender();
}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur==='dark'||(!cur&&matchMedia('(prefers-color-scheme:dark)').matches);applyTheme(dark?'light':'dark');}

/* ── boot ── */
function shell(){
  const nav=[['vision','rocket','Visión'],['resumen','grid','Resumen'],['canales','play','Canales'],['produccion','activity','Producción'],['contenido','film','Contenido'],['redes','share','Redes'],['monetizacion','cost','Monetización'],['agenda','cal','Agenda'],['informe','report','Informe']];
  document.getElementById('root').outerHTML=`<div class="app">
    <aside class="rail"><div class="brand"><div class="dot">V</div><div><b>Centro de Mando</b><span>videogen network</span></div></div>
      <nav class="nav">${nav.map(([k,i,l])=>`<button data-sec="${k}">${svg(i)}<span>${l}</span></button>`).join('')}</nav>
      <div class="foot"><div class="eyebrow">Actualizado</div><div class="t" id="foot-upd">—</div>
        <a href="https://yassinebhk.github.io/automated-videos/dashboard/" target="_blank" rel="noopener">github.io/automated-videos/dashboard</a></div></aside>
    <div class="main"><div class="topbar"><div><h1 id="tb-title">Resumen</h1>
        <div class="sub"><span class="live"></span><span id="tb-upd">en tiempo real</span> · ${DATA.range.days} días de histórico</div></div>
        <div class="tb-right"><button class="iconbtn" id="themebtn"></button></div></div>
      <div class="wrap">
        <section class="view" id="v-vision"></section>
        <section class="view" id="v-resumen"></section><section class="view" id="v-canales"></section>
        <section class="view" id="v-produccion"></section>
        <section class="view" id="v-contenido"></section><section class="view" id="v-redes"></section>
        <section class="view" id="v-monetizacion"></section>
        <section class="view" id="v-agenda"></section>
        <section class="view" id="v-informe"></section></div></div></div>`;
  const TL={vision:'Visión',resumen:'Resumen',canales:'Canales',produccion:'Producción',contenido:'Contenido',redes:'Redes sociales',monetizacion:'Monetización',agenda:'Agenda',informe:'Informe'};
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.getElementById('tb-title').textContent=TL[b.dataset.sec];go(b.dataset.sec)});
  document.getElementById('themebtn').onclick=toggleTheme;
  document.getElementById('scrim').onclick=closeDrawer;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
  document.getElementById('foot-upd').textContent=DATA.generated_local;
  document.getElementById('tb-upd').textContent='act. '+DATA.generated_local;
}
async function boot(){
  let t=null;try{t=localStorage.getItem('dash-theme')||null}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  try{DATA=window.__DASHBOARD_DATA__||await (await fetch('data.json',{cache:'no-store'})).json();}
  catch(e){document.getElementById('root').innerHTML='<div class="loading"><div>No se pudo cargar <b>data.json</b>. Genera con <code>videogen dashboard</code>.</div></div>';return;}
  shell();applyTheme(t);
  const init=(location.hash||'').slice(1);
  go(R[init]?init:'vision');startAutoRefresh();
}
function startAutoRefresh(){
  if(window.__DASHBOARD_DATA__)return; // datos incrustados → sin fetch
  setInterval(async()=>{
    try{
      const fresh=await (await fetch('data.json',{cache:'no-store'})).json();
      if(fresh&&fresh.generated_at&&fresh.generated_at!==DATA.generated_at){
        DATA=fresh;
        const fu=document.getElementById('foot-upd');if(fu)fu.textContent=DATA.generated_local;
        const tu=document.getElementById('tb-upd');if(tu)tu.textContent='act. '+DATA.generated_local;
        if(!document.getElementById('drawer').classList.contains('on'))rerender();
      }
    }catch(e){}
  },120000); // cada 2 min
}
boot();
</script>
